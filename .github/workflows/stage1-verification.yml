name: Stage-1 verification
on:
  push:
    branches: [Rida]
  pull_request:
    branches: [Rida]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  stage1-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      CUDA_VISIBLE_DEVICES: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install CPU test dependencies
        run: |
          python -m pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt numpy==1.26.4 opencv-python==4.11.0.86
      - name: Check root imports and run combined contributor and Stage-1 tests
        run: |
          python -m compileall -q data preprocessing talim models training evaluation tests
          python verify_ctc_labels.py --help
          python verify_model_prep.py --help
          python -m data.build_full_tier_dataset --help
          python -m pytest tests -q
